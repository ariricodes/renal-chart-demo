<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D7482">
<title>Renal Dialysis Chart (Demo)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: a chart on a desk. A quiet patient list on the left, the white sheet on the right, hairline rules instead of boxes, one petrol accent, numbers in mono. */
:root{
  --font-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --bg:#F1F5F6; --sheet:#FFFFFF; --sheet-2:#F6F9FA;
  --ink:#13292E; --ink-2:#435B61; --ink-3:#5A7178;
  --line:#DCE6E8; --line-soft:#E9F0F1; --grid:#E9F0F1; --axis:#BCCBCE;
  --accent:#0D7482; --accent-ink:#FFFFFF; --accent-soft:#E1F1F3; --accent-line:#97CBD3;
  --shadow:0 1px 2px rgba(19,41,46,.05),0 10px 30px rgba(19,41,46,.06); --shadow-sm:0 1px 2px rgba(19,41,46,.06); --glow:rgba(13,116,130,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0B6B2E; --good-bg:#DDF1E3; --warn:#7A4A00; --warn-bg:#FFEFCC; --crit:#B3261E; --crit-bg:#FCE4E2;
  --g-low:#D8605B; --g-mid:#E9B040; --g-ok:#3FA467; --blood:#C0392B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1518; --sheet:#122125; --sheet-2:#17292D;
    --ink:#E5F0F2; --ink-2:#B3C6CB; --ink-3:#8CA3A9;
    --line:#2A4046; --line-soft:#203338; --grid:#203338; --axis:#37535A;
    --accent:#6CC7D3; --accent-ink:#0A1518; --accent-soft:#16363C; --accent-line:#2F6A74;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#66D36E; --good-bg:#16301A; --warn:#F5B94A; --warn-bg:#3A2D10; --crit:#FF8F86; --crit-bg:#41201E;
    --g-low:#E5776F; --g-mid:#E3B04A; --g-ok:#4DBB7A; --blood:#E56B5F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 1px 2px rgba(0,0,0,.35); --glow:rgba(108,199,211,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1518; --sheet:#122125; --sheet-2:#17292D;
  --ink:#E5F0F2; --ink-2:#B3C6CB; --ink-3:#8CA3A9;
  --line:#2A4046; --line-soft:#203338; --grid:#203338; --axis:#37535A;
  --accent:#6CC7D3; --accent-ink:#0A1518; --accent-soft:#16363C; --accent-line:#2F6A74;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#66D36E; --good-bg:#16301A; --warn:#F5B94A; --warn-bg:#3A2D10; --crit:#FF8F86; --crit-bg:#41201E;
  --g-low:#E5776F; --g-mid:#E3B04A; --g-ok:#4DBB7A; --blood:#E56B5F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 1px 2px rgba(0,0,0,.35); --glow:rgba(108,199,211,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg) radial-gradient(1000px 420px at 88% -8%,var(--glow),transparent 62%) no-repeat;color:var(--ink);font:15px/1.55 var(--font-body);
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1200px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.012em;text-wrap:balance}
h2{font-size:26px;font-weight:600;line-height:1.2}
h3{font-size:16px;font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:13px}
.lbl{font:500 11px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.empty{padding:44px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:18px;margin-bottom:6px;color:var(--ink)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--font-display);letter-spacing:-.015em;color:var(--ink);text-decoration:none}
.top-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top-r a.nl{font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 4px}
.top-r a.nl:hover,.top-r a.nl[aria-current="page"]{color:var(--accent)}
.me{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1.25}
.me img{width:30px;height:30px;border-radius:50%;display:block;background:var(--sheet-2)}
.me .role{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;min-width:0}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.today{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;min-height:62vh;min-width:0}
.sheet-in{padding:26px 30px 30px}
input[type=search]{width:100%}
.plist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.prow:hover{background:var(--sheet)}
.prow.on{background:var(--sheet);outline:1px solid var(--line);outline-offset:-1px}
.prow .nm{font:600 15px var(--font-display);overflow-wrap:anywhere}
.prow .mt{font-size:12px;color:var(--ink-3);grid-column:1}
.prow .sp{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.prow .sp svg{display:block}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font:600 13px var(--font-body);cursor:pointer;text-decoration:underline}

.btn{font:600 14px var(--font-body);padding:9px 16px;min-height:40px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--sheet-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{min-height:32px;padding:4px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.3 var(--font-body);padding:2px 10px 2px 8px;border-radius:999px;margin:2px 6px 2px 0}
.pill::before{content:"";flex:none;width:8px;height:8px;background:currentColor}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.ok::before{border-radius:50%}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.warn::before{transform:rotate(45deg) scale(.85)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.crit::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.mute{background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.mute::before{border-radius:2px;opacity:.6}
.tag{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;padding:3px 6px;border-radius:4px;white-space:nowrap;margin-left:auto}
.tag.req{color:var(--accent);background:var(--accent-soft)}
.tag.opt{color:var(--ink-3);border:1px solid var(--line)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:11px 14px;margin-bottom:16px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.notice.warn{background:var(--warn-bg);color:var(--warn)}

.back{display:inline-block;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:10px}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between}
.ph .meta{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.subtabs{display:flex;gap:2px;margin:20px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs a{white-space:nowrap}
.subtabs a{padding:10px 14px;font-weight:600;font-size:14px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs a:hover{color:var(--ink)}
.subtabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 8px}

.gfx-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin-block:16px 4px}
.gfx{padding:14px 20px;min-width:0;border-left:1px solid var(--line-soft)}
.gfx:first-child{border-left:0;padding-left:0}
.gfx:last-child{padding-right:0}
.gfx h4{font:500 11px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:2px}
.gfx svg{display:block;width:100%;height:auto;max-width:340px}
.gfx svg text{font:11px var(--font-mono);fill:var(--ink-3)}
.gfx svg text.v{font:600 24px var(--font-mono);fill:var(--ink)}
.gfx svg text.st{font:600 12px var(--font-body);fill:var(--ink-2)}
.gfx .cap{font-size:13px;color:var(--ink-2);margin-top:2px}
.gfx-empty{padding:34px 0;color:var(--ink-3);font-size:13px}
.circ{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
.circ::after{content:"Swipe sideways to see the whole diagram";display:none;font-size:12px;color:var(--ink-3);padding-top:4px}
@media (max-width:640px){.circ::after{display:block}}
.circ svg{display:block;min-width:560px;width:100%;height:auto}
.circ svg .box{fill:var(--sheet-2);stroke:var(--ink-3);stroke-width:1.5}
.circ svg text{font:12px var(--font-body);fill:var(--ink-2)}
.circ svg text.n{font:600 13px var(--font-mono);fill:var(--ink)}

.srow{display:grid;grid-template-columns:150px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 14px;gap:4px 16px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line-soft);text-decoration:none;color:var(--ink)}
.srow:hover{background:var(--sheet-2)}
.srow .d{font:600 15px var(--font-display)}
.srow .n{font:500 14px var(--font-mono)}
.srow .s{font-size:12px;color:var(--ink-3)}
.srow .chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-top:2px solid var(--ink-3);transform:rotate(45deg)}
.srow.void{opacity:.62}
.srow.void .d{text-decoration:line-through}
@media (max-width:760px){
  .srow{grid-template-columns:1fr 1fr;gap:6px 12px}
  .srow .c3{grid-column:1}
  .srow .chev{display:none}
  .srow .c4{grid-column:1/-1}
}

.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px 34px;margin-top:6px}
.kvs h3{font:500 11px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.kv{margin:0;display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line-soft);min-width:0}
.kv dt{color:var(--ink-2);font-size:14px}
.kv dd{margin:0;font:500 14px var(--font-mono);text-align:right;overflow-wrap:anywhere}
.kv dd.t{font:500 14px var(--font-body)}
.kv small{font:400 12px var(--font-body);color:var(--ink-3)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.ph-grid figure{margin:0;min-width:0}
.ph-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:var(--sheet-2)}
.ph-grid figcaption{font-size:12px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.ph-grid input{margin-top:4px;min-height:34px;font-size:13px}

.fn{margin-top:36px;font-size:12px;color:var(--ink-2)}
.fn::before{content:"";display:block;width:72px;border-top:1px solid var(--ink-3);margin-bottom:10px}
.fn ol{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.fn sup{font-weight:600;margin-right:6px;color:var(--ink)}
.fn b{font-weight:600;color:var(--ink)}
.fn .admin{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}

.form-cols{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:30px;align-items:start;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:0;min-width:0}
.ess{padding-bottom:18px}
.ess-h,.sec>summary{display:flex;align-items:center;gap:10px}
.ess-h{font:600 16px var(--font-display);margin-bottom:12px}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.span2{grid-column:span 2}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{font:400 15px var(--font-body);min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--sheet);color:var(--ink);width:100%;min-width:0}
input[type=number]{font-family:var(--font-mono);font-size:14px}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--accent)}
textarea{min-height:78px;resize:vertical}
.f.todo input,.f.todo select{border-color:var(--accent-line);background:var(--accent-soft)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--crit);background:var(--crit-bg)}
.f small{color:var(--ink-3);font-size:12px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.pair span{color:var(--ink-3)}
details.sec{border-top:1px solid var(--line)}
details.sec:last-of-type{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;padding:15px 2px;cursor:pointer;font:600 15px var(--font-display)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary .ct{font:400 12px var(--font-body);color:var(--ink-3)}
.sec-body{padding:2px 2px 20px}
.sec-body .hint{margin:0 0 12px}
.chk{display:flex;flex-wrap:wrap;gap:10px 20px;margin-bottom:14px}
.chk label{display:flex;align-items:center;gap:8px;font-size:14px}
.rd{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rd-main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end}
.rd-main .f>label,.rd-more .f>label{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.rd details{margin-top:8px}
.rd details summary{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.rd-more{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.side h3{margin-bottom:8px}
.rb{display:flex;align-items:center;gap:10px;font-size:14px}
.rb img{width:34px;height:34px;border-radius:50%;background:var(--sheet-2);flex:none}
.rb small{display:block;color:var(--ink-3);font-size:12px}
.ck{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px}
.ck li{display:flex;align-items:center;gap:9px;color:var(--ink-2)}
.ck li::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-line)}
.ck li.done{color:var(--ink)}
.ck li.done::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--sheet)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.calc .v{font:600 18px var(--font-mono)}
.err{color:var(--crit);font-weight:600;font-size:14px;margin:14px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.void-box{background:var(--crit-bg);border-radius:8px;padding:14px;margin:14px 0}

.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:28px 30px;margin-top:14px}
.cc{min-width:0;display:flex;flex-direction:column;gap:6px}
.cc .sub{margin:0}
.chart{position:relative;min-height:60px}
.chart svg{display:block;width:100%;touch-action:pan-y;overflow:visible}
.chart svg text{font:11px var(--font-mono);fill:var(--ink-3)}
.chart svg text.ln{fill:var(--ink-2);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend .sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{position:absolute;top:4px;left:0;display:none;pointer-events:none;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.14);white-space:nowrap;z-index:3}
.tip .th{font-weight:600;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tip .tr b{font:500 12px var(--font-mono);margin-left:12px}
details.plain{font-size:13px;color:var(--ink-2)}
details.plain summary{cursor:pointer;font-weight:600;padding:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--sheet)}
.seg button{font:600 13px var(--font-body);padding:7px 14px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th{font:500 11px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
td.num{font-family:var(--font-mono);font-size:13px}
td.wrap{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:0}
.tbl-wrap.small th,.tbl-wrap.small td{padding:7px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(5,12,14,.88);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:86vh;border-radius:6px}
.lb .btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.foot{margin-top:22px;font-size:12px;color:var(--ink-3);max-width:74ch}

function notify(p){

    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){var S1=ror(e,6)^ror(e,11)^ror(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K256[i]+w[i])|0,S0=ror(a,2)^ror(a,13)^ror(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}

function utf8(x){return new TextEncoder().encode(x);}

function tryLogin(email,pw){
  email=normEmail(email);var f=fails[email]||{n:0,until:0},now=Date.now();
  if(f.until>now)return {ok:false,msg:'Too many tries. Wait '+Math.ceil((f.until-now)/1000)+' seconds and try again.'};

  var good=a&&a.active!==false&&hashPw(pw,a.salt)===a.hash;
  if(!good){f.n++;if(f.n>=5){f.until=now+30000;f.n=0;}fails[email]=f;return {ok:false,msg:(a&&a.active===false)?'This account is turned off. Ask an admin.':'Email or password is not right.'};}

function origPill(p){var v=orOf(p);if(v==='Regular (maintenance)')return '';var c=/^Transferred/.test(v)?'tr':(/^New|One-time/.test(v)?'nw':'vs');return '<span class="stp og-'+c+'" title="Patient status: '+esc(v)+'">'+esc(v)+'</span>';}
function ptOf(p){return (p&&p.ptype)||'Standard';}
function typePill(p){var v=ptOf(p),c={Standard:'std',Infectious:'inf',Toxic:'tox','High-risk':'risk'}[v]||'std';return '<span class="stp pt-'+c+'" title="Patient type: '+esc(v)+'">'+(v==='Infectious'?'\u26A0 ':(v==='Toxic'||v==='High-risk'?'! ':''))+esc(v)+'</span>';}
function setPill(p,short){var v=setOf(p);return v?'<span class="stp '+(v==='IPD'?'ipd':'opd')+'">'+(short?v:(v==='IPD'?'Inpatient · IPD':'Outpatient · OPD'))+'</span>':'';}
function scheduleHTML(){
  var list=Object.keys(patients).map(function(k){return patients[k];}).filter(function(p){return p.status!=='archived';});
  if(isAdmin&&schedNurse)list=list.filter(function(p){return (p.nurses||[]).indexOf(schedNurse)>=0;});
  var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],days=[],tot=0,uniq={},opd=0,ipd=0,i;
  for(i=0;i<14;i++){
    var d=new Date();d.setDate(d.getDate()+i);var dow=d.getDay();
    var ps=list.filter(function(p){return schedDays(p.schedule).indexOf(dow)>=0;}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
    ps.forEach(function(p){tot++;uniq[p.id]=1;if(setOf(p)==='IPD')ipd++;else if(setOf(p)==='OPD')opd++;});
    days.push({d:d,dow:dow,ps:ps,i:i});
  }
  var sel='';
  if(isAdmin){sel='<label class="sched-sel"><span class="sub">Show</span><select id="sched-nurse"><option value="">All nurses</option>'+staffList().filter(function(u){return u.role!=='admin'&&u.active!==false;}).map(function(u){return '<option value="'+esc(u.id)+'"'+(u.id===schedNurse?' selected':'')+'>'+esc(u.name||'Unnamed')+'</option>';}).join('')+'</select></label>';}
  var h='<div class="sec-h"><h3>'+(isAdmin?(schedNurse&&staff[schedNurse]?esc(staff[schedNurse].name)+'’s schedule':'Schedule for all nurses'):'My schedule')+' · next 2 weeks</h3>'+sel+'</div>';
  h+='<p class="sub" style="margin:0 0 10px"><b>'+tot+'</b> '+(tot===1?'session':'sessions')+' for <b>'+Object.keys(uniq).length+'</b> '+(Object.keys(uniq).length===1?'patient':'patients')+' · '+opd+' outpatient (OPD) · '+ipd+' inpatient (IPD). Days come from each patient’s schedule.</p>';
  h+='<div class="sched">'+days.map(function(x){
    var cls='sday'+(x.i===0?' now':'')+((x.dow===0||x.dow===6)?' wk':'')+(x.ps.length?'':' none');
    return '<div class="'+cls+'"><div class="dh"><b>'+DN[x.dow]+'</b> '+x.d.getDate()+' '+x.d.toLocaleDateString('en-GB',{month:'short'})+(x.i===0?' <span class="tdy">Today</span>':'')+'<span class="n">'+x.ps.length+'</span></div>'
     +(x.ps.length?x.ps.map(function(p){return '<a class="si" href="#p-'+p.id+'"><span class="sn">'+esc((p.name||'Unnamed').replace(/\s*\(sample\)\s*$/i,''))+'</span>'+setPill(p,true)+typePill(p)+origPill(p)+(isAdmin&&nurseNames(p)?'<span class="sub">'+esc(nurseNames(p))+'</span>':'')+'</a>';}).join(''):'<span class="sub">No sessions</span>')+'</div>';
  }).join('')+'</div>';
  return h;
}
function assignModal(kind,id){
  var items,cur;
  if(kind==='nurse'){
    var u=staff[id];if(!u)return;
    items=Object.keys(rawP).map(function(k){return rawP[k];}).filter(function(p){return p.status!=='archived';}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(p){return {id:p.id,label:p.name||'Unnamed',sub:[setOf(p),ptOf(p)].filter(Boolean).join(' · '),on:(p.nurses||[]).indexOf(id)>=0};});
    var title='Assign patients to '+(u.name||'nurse'),intro='Tick every patient this nurse handles. The nurse then sees them on the Today page.';
  }else{
    var p0=rawP[id]||patients[id];if(!p0)return;
    items=staffList().filter(function(u){return u.role!=='admin'&&u.active!==false;}).map(function(u){return {id:u.id,label:u.name||'Unnamed',sub:u.license?'Lic. '+u.license:'no license on file',on:(p0.nurses||[]).indexOf(u.id)>=0};});
    var title='Assign nurses to '+(p0.name||'patient'),intro='Only the nurses ticked here (and admins) can see this patient.';
  }
  if(!items.length){toast(kind==='nurse'?'There are no patients yet.':'There are no nurses yet. Add staff first.');return;}
  var h='<h3 id="m-title">'+esc(title)+'</h3><p class="sub" style="margin:4px 0 12px">'+esc(intro)+'</p><div class="m-opts" style="max-height:48vh;overflow:auto">'+items.map(function(x){return '<label class="m-opt"><input type="checkbox" name="as" value="'+esc(x.id)+'"'+(x.on?' checked':'')+'><span>'+esc(x.label)+(x.sub?' <span class="sub">· '+esc(x.sub)+'</span>':'')+'</span></label>';}).join('')+'</div><p class="err" id="m-err" role="alert" hidden></p><div class="actions"><button type="button" class="btn primary" data-act="modal-ok">Save assignment</button><button type="button" class="btn" data-act="modal-cancel">Cancel</button></div>';
  openModal(h,{onOk:function(){
    var on=$$('input[name=as]:checked').map(function(x){return x.value;}),now=nowISO(),jobs=[];
    function write(pid,arr){
      var p=rawP[pid];if(!p)return;
      var doc=Object.assign({},strip(p),{nurses:arr,updatedAt:now,updatedBy:me.id,edits:(p.edits||[]).concat([{kind:'Edited',by:me.id,byName:myName(),at:now,fields:['assigned nurses']}]).slice(-40)});
      jobs.push(Promise.resolve(db.doc('patients/'+pid).set(doc)).then(function(){return logEvent('patient-edit',pid,null);}));
    }
    if(kind==='nurse'){
      items.forEach(function(x){var p=rawP[x.id],has=(p.nurses||[]).indexOf(id)>=0,want=on.indexOf(x.id)>=0;if(has===want)return;write(x.id,want?(p.nurses||[]).concat([id]):(p.nurses||[]).filter(function(n){return n!==id;}));});
    }else{
      var err=$('#m-err');if(!on.length){err.textContent='Choose at least one nurse.';err.hidden=false;return false;}
      write(id,on);
    }
    if(!jobs.length){return true;}
    afterWrite(Promise.all(jobs).then(function(){toast('Assignment saved');scheduleRender();})).catch(function(){});
    return true;
  }});
}

function saveFile(name,text){
  if(!dlCap){toast('Downloads are not available here.');return;}
  Promise.resolve(dlCap.save({filename:name,data:text})).then(function(){toast('File ready');}).catch(function(e){if(!e||e.code!=='declined')toast('The file could not be saved.');});
}
function downscale(file,max,quality){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('encode'));},'image/jpeg',quality);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('load'));};
    img.src=url;
  });
}
function addPhoto(file){
  var msg=$('#photo-msg');
  if(!assetsCap||!file)return;
  if(!/^image\//.test(file.type)){toast('Choose an image file.');return;}
  if(formPhotos.length>=6){toast('Up to 6 photos per session.');return;}
  if(msg)msg.textContent='Uploading…';
  downscale(file,1600,0.82).then(function(blob){return assetsCap.upload(blob,{type:'image/jpeg'});}).then(function(r){
    formPhotos.push({id:r.id,caption:'',at:nowISO(),by:me.id,byName:myName()});
    $('#photos').innerHTML=photoGridHTML(true);if(msg)msg.textContent='';
  }).catch(function(e){
    if(msg)msg.textContent='';
    toast(e&&e.code==='too_large'?'That photo is too large.':'That photo could not be added. Try a JPEG or PNG.');
  });
}

function howHTML(){
  return '<details class="plain" style="margin-top:24px;max-width:70ch"><summary>How the numbers and flags are worked out</summary><div style="padding-top:6px"><p><b>Weight gain</b> = this session’s pre-weight minus the last session’s post-weight. Flag above '+TH.idwgPct+'% of dry weight.</p><p><b>UF rate</b> = fluid removed (mL) ÷ post-weight (kg) ÷ run hours. Flag above '+TH.ufr+' mL/kg/h. Fluid removed is the entered actual UF, or pre-weight minus post-weight if left blank.</p><p><b>URR</b> = (1 − post BUN ÷ pre BUN) × 100. Flag below '+TH.urr+'%.</p><p><b>spKt/V</b> uses the Daugirdas second-generation formula: −ln(R − 0.008 × hours) + (4 − 3.5 × R) × fluid removed (L) ÷ post-weight (kg), where R is post BUN ÷ pre BUN. Critical below '+TH.ktvMin+'; warning below the patient’s own target.</p><p><b>Blood pressure</b>: critical if systolic goes below '+TH.sbpLow+' at any reading, warning if it falls '+TH.sbpDrop+' or more from the start.</p><p>Any ticked finding is flagged. Flags are prompts for the nurse and doctor, not diagnoses.</p></div></details>';
}

}

  else if(act==='act-csv')saveFile('activity-log-'+todayISO()+'.csv',activityCSV());
  else if(act==='data-json')saveFile('dialysis-chart-records-'+todayISO()+'.json',JSON.stringify({exported:nowISO(),patients:Object.keys(patients).map(function(k){return Object.assign({id:k},patients[k]);}),sessions:allS().map(function(s){return Object.assign({id:s.id},s);})},null,2));
});

function onData(){if(gotP&&gotS){authState='ok';scheduleRender();}}
function onErr(e){authState='error';authMsg=(e&&e.code==='revoked')?'Your access to this page changed. Reload the page.':'Records could not be loaded. Reload the page and try again.';render();}
function boot(){
  render();
  var c=window.claude;
  if(!c||!c.use){authState='nodb';render();return;}
  Promise.all([c.use('db'),c.use('user'),c.use('assets'),c.use('downloads')]).then(function(r){
    db=r[0];userCap=r[1];assetsCap=r[2];dlCap=r[3];
    if(!db){authState='nodb';render();return;}
    var jobs=userCap?[userCap.me(),userCap.canEdit(),userCap.can('data.write')]:[null,false,null];
    return Promise.all(jobs).then(function(u){
      if(u[0])me=u[0];isAdmin=!!u[1];canWrite=u[2]!==false;
      if(!me.id){canWrite=false;}
      touchUser();
      db.doc('settings/thresholds').onSnapshot(function(s){var d=s.exists?s.data():{};Object.keys(DEF).forEach(function(k){TH[k]=(typeof d[k]==='number'&&d[k]>0)?d[k]:DEF[k];});limMeta=s.exists?{by:d.updatedBy,byName:d.updatedByName,at:d.updatedAt}:null;if(gotP&&gotS)scheduleRender();},function(){});
      db.doc('settings/philhealth').onSnapshot(function(s){var d=s.exists?s.data():{};PHCFG={limit:d.limit>0?d.limit:null,items:Array.isArray(d.items)&&d.items.length?d.items:null,meta:s.exists?{by:d.updatedBy,byName:d.updatedByName,at:d.updatedAt}:null};if(gotP&&gotS)scheduleRender();},function(){});
      authApi=(window.claude&&window.claude.auth)||null;
      db.collection('staff').onSnapshot(function(snap){staff={};snap.docs.forEach(function(d){staff[d.id]=Object.assign({},d.data(),{id:d.id});});gotStaff=true;ensureStaff();syncAuthStaff();if(gotP&&gotS)scheduleRender();},function(){gotStaff=true;});
      db.collection('patients').onSnapshot(function(snap){rawP={};snap.docs.forEach(function(d){rawP[d.id]=Object.assign({},d.data(),{id:d.id});});gotP=true;rebuild();onData();},onErr);
      db.collection('notes').onSnapshot(function(snap){rawN={};snap.docs.forEach(function(d){rawN[d.id]=Object.assign({},d.data(),{id:d.id});});gotN=true;rebuild();if(gotP&&gotS)scheduleRender();},function(){});
      db.collection('paperwork').onSnapshot(function(snap){rawPaper={};snap.docs.forEach(function(d){rawPaper[d.id]=d.data();});rebuild();if(gotP&&gotS)scheduleRender();},function(){});
      db.collection('tasks').onSnapshot(function(snap){rawT={};snap.docs.forEach(function(d){rawT[d.id]=Object.assign({},d.data(),{id:d.id});});rebuild();if(gotP&&gotS)scheduleRender();},function(){});
      db.collection('sessions').onSnapshot(function(snap){rawS={};snap.docs.forEach(function(d){rawS[d.id]=Object.assign({},d.data(),{id:d.id});});gotS=true;rebuild();onData();},onErr);
    });
  }).catch(function(){authState='nodb';render();});
}
boot();
})();
